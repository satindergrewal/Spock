name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt · clippy · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: build
        run: cargo build --release

  macos-app:
    name: macos app (swift)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Spock.app
        run: ./packaging/macos/build-app.sh
      - name: Verify bundle
        run: |
          test -x dist/Spock.app/Contents/MacOS/spock-proxy
          test -x dist/Spock.app/Contents/MacOS/Spock
          plutil -lint dist/Spock.app/Contents/Info.plist
