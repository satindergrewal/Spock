[package]
name = "spock"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Local multi-backend Anthropic Messages proxy for Claude Code — xAI Grok, OpenAI-compat, Ollama, and more"
license = "MIT"
repository = "https://github.com/satindergrewal/Spock"
readme = "README.md"
keywords = ["anthropic", "claude-code", "proxy", "openai-compatible", "xai"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "spock"
path = "src/main.rs"

# Direct deps only — keep this list short. Exact tree is pinned in Cargo.lock
# (committed). CI and packaging use `cargo … --locked`. Bump intentionally.
[dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Qwen OAuth device flow requires PKCE (S256).
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# macOS UI is a native Swift app (macos/). No wry/WebView tray in Rust.
[features]
default = []

[profile.release]
lto = true
codegen-units = 1
strip = true
