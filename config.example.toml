# Spock multi-backend config
# Copy to ~/.config/spock/config.toml (spock serve creates a default on first run)
#
# Direct deps are pinned via Cargo.lock. Build with: cargo build --locked --release
#
# Backend types:
#   oauth    — subscription OAuth (provider = xai | kimi | …); optional api_key escape hatch
#   api_key  — OpenAI Chat Completions compatible API + bearer key
#   anthropic — Messages passthrough
#
# Login:  spock login <provider>     (xai, kimi)
# Logout: spock logout <provider>

[server]
bind = "127.0.0.1"
port = 8048
profile = "xai-only"

# --- Backends ---

[backends.xai]
type = "oauth"
provider = "xai"
# base_url = "https://api.x.ai/v1"
# Priority: api_key → env XAI_TOKEN → OAuth (spock login xai)
# api_key = "xai-..."

[backends.kimi]
type = "oauth"
provider = "kimi"
# base_url = "https://api.kimi.com/coding/v1"
# Priority: api_key → env KIMI_TOKEN → OAuth (spock login kimi)

[backends.ollama]
type = "api_key"
base_url = "http://127.0.0.1:11434/v1"
# api_key = ""

# Example LAN llama-server / vLLM (use your host; do not commit real IPs)
# [backends.lan]
# type = "api_key"
# base_url = "http://10.0.0.5:8080/v1"

# --- OpenAI-compatible presets (uncomment + set key) ---
# All stay type = "api_key". Optional:
#   api_key_env     — read bearer from this env if api_key empty
#   extra_headers   — map of HTTP headers (OpenRouter likes Referer / X-Title)

